name: Suflyor Windows build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download pinned Russian Zipformer model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-small-ru-vosk-int8-2025-08-16/resolve/31fa603e4f31279c6e1f7600fed13dc4312663ab"
          $dir = "SuflyorWindows/Models/asr-ru"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $files = @(
            @{ Name = "encoder.int8.onnx"; Hash = "e0db705e94ec35d803b1df4f40cda23d064e1142977c80ab288430b109777a9d" },
            @{ Name = "decoder.onnx"; Hash = "89b3088a9e20e1ef7f2e85ce1a3478afe6a9c4ac57369cabcc4beb8e95328ea0" },
            @{ Name = "joiner.int8.onnx"; Hash = "b55784b071ab7512eab4c7c44e4f5478284ef33c83562cc6a249b972515a31e5" },
            @{ Name = "tokens.txt"; Hash = "93bbbc0bae6b78c0bbb743d4aa9fded3bb5ff3aac5f0200e3a769a5a05e0fdf6" }
          )
          foreach ($file in $files) {
            $target = Join-Path $dir $file.Name
            Invoke-WebRequest -Uri "$base/$($file.Name)" -OutFile $target
            $actual = (Get-FileHash -Path $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $file.Hash) { throw "SHA256 mismatch for $($file.Name): $actual" }
            Write-Host "Verified $($file.Name)"
          }

      - name: Restore
        run: dotnet restore SuflyorWindows.sln

      - name: Build
        run: dotnet build SuflyorWindows.sln --configuration Release --no-restore

      - name: Publish self-contained x64
        run: dotnet publish SuflyorWindows/SuflyorWindows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PlatformTarget=x64 -o artifacts/SuflyorWindows-win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuflyorWindows-win-x64
          path: artifacts/SuflyorWindows-win-x64/
          if-no-files-found: error
          retention-days: 14
