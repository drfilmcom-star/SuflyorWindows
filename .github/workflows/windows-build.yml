name: Suflyor Windows build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SuflyorWindows.sln

      - name: Build
        run: dotnet build SuflyorWindows.sln --configuration Release --no-restore -p:Platform=x64

      - name: Publish self-contained x64
        run: dotnet publish SuflyorWindows/SuflyorWindows.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -o artifacts/SuflyorWindows-win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuflyorWindows-win-x64
          path: artifacts/SuflyorWindows-win-x64/
          if-no-files-found: error
          retention-days: 14
